name: Update clones badge

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch to badges branch
        run: |
          if git ls-remote --exit-code --heads origin badges; then
            git fetch origin badges
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi

      - name: Add up clones
        env:
          TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/traffic/clones",
              headers={"Authorization": f"Bearer {os.environ['TOKEN']}",
                       "Accept": "application/vnd.github+json"})
          data = json.load(urllib.request.urlopen(req))
          try:
              history = json.load(open("history.json"))
          except FileNotFoundError:
              history = {}
          for day in data["clones"]:
              history[day["timestamp"][:10]] = day["count"]
          json.dump(history, open("history.json", "w"), indent=1, sort_keys=True)
          badge = {"schemaVersion": 1, "label": "clones",
                   "message": str(sum(history.values())), "color": "blue"}
          json.dump(badge, open("clones.json", "w"))
          PY

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json clones.json
          git diff --cached --quiet || git commit -m "Update clone count"
          git push origin badges
